spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    gateway:
      routes:
        - id: spring-6-rest-mvc
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/*

        - id: spring-6-webflux
          uri: http://localhost:8082
          predicates:
            - Path=/api/v2/*

        - id: spring-6-webflux-fn
          uri: http://localhost:8083
          predicates:
            - Path=/api/v3/*

### For Spring Actuator integration with K8s
### http://localhost:8080/actuator/health/readiness and http://localhost:8080/actuator/health/liveness
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true


### Enable log tracing for LogBook
logging:
  level:
    org.zalando.logbook: trace

